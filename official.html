<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#050014;
  color:#fff;
  transition:.4s;
}

/* LIGHT MODE */
body.light{
  background:#f5f5ff;
  color:#111;
}

/* BG ANIMATION */
body::before{
  content:"";
  position:fixed;
  width:300%;
  height:300%;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffe1,#ff00cc);
  animation:bgMove 12s linear infinite;
  z-index:-1;
  opacity:.12;
}
@keyframes bgMove{
  100%{transform:translate(-50%,-50%)}
}

/* HEADER */
.header{
  text-align:center;
  padding:25px;
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TOGGLE */
.toggle{
  position:fixed;
  top:15px;
  right:15px;
  cursor:pointer;
  padding:8px 14px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
}

/* CONTAINER */
.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 0 15px rgba(255,0,200,.4);
  transition:.3s;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

/* Shine effect */
.card::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.6),transparent);
  transition:.6s;
}

.card:hover::before{
  left:100%;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px #ff00cc;
}

/* TEXT */
.name{
  font-size:20px;
  font-weight:600;
}

.id{
  font-size:14px;
  opacity:.7;
}

/* BACK BUTTON */
.back{
  display:inline-block;
  margin-top:20px;
  padding:10px 20px;
  border-radius:25px;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg,#ff4ecb,#7b5cff);
}
</style>
</head>
