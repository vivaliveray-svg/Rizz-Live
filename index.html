<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live Hiring</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#050014;
  color:#fff;
  transition:0.4s;
}

/* LIGHT MODE */
body.light{
  background:#f5f5ff;
  color:#111;
}

body.light .title,
body.light .hiring,
body.light .positions li{
  color:#111;
  -webkit-text-fill-color:unset;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:300%;
  height:300%;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffe1,#ff00cc);
  animation:bgMove 12s linear infinite;
  z-index:-1;
  opacity:.15;
}

@keyframes bgMove{
  100%{
    transform:translate(-50%,-50%);
  }
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.leftHead{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo img{
  width:55px;
  border-radius:50%;
}

.title{
  font-size:26px;
  font-weight:800;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:11px;
  opacity:.8;
}

.toggle{
  cursor:pointer;
  padding:10px 16px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  color:#fff;
  font-weight:600;
}

/* HERO */
.hero{
  display:flex;
  justify-content:center;
  margin-top:30px;
}

/* GLASS CARD */
.glass{
  width:100%;
  max-width:650px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  border-radius:24px;
  padding:30px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 20px rgba(255,0,200,.25);
}

.mascot{
  position:absolute;
  top:10px;
  right:15px;
}

.mascot img{
  width:75px;
}

.tag{
  display:inline-block;
  padding:6px 14px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  font-size:14px;
}

.hiring{
  font-size:60px;
  margin:12px 0;
  background:linear-gradient(90deg,#fff,#ff9ae6,#a18cff,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.positions{
  margin-top:10px;
}

.positions li{
  list-style:none;
  margin:8px 0;
  font-size:16px;
}

/* BUTTONS */
.policy-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.policy-btn{
  text-decoration:none;
  color:#fff;
  text-align:center;
  padding:10px;
  font-size:14px;
  border-radius:25px;
  background:linear-gradient(135deg,#ff4ecb,#7b5cff);
}

.special{
  background:linear-gradient(135deg,#00c6ff,#0072ff);
}

/* FOOTER */
.footer{
  margin-top:35px;
  text-align:center;
}

.box{
  display:inline-block;
  padding:18px 28px;
  border-radius:25px;
  margin-bottom:18px;
}

.official-box{
  background:linear-gradient(135deg,#ff00cc,#3333ff);
  box-shadow:0 0 25px rgba(255,0,200,.6);
}

.whatsapp-box{
  background:linear-gradient(135deg,#25D366,#128C7E);
  box-shadow:0 0 25px rgba(37,211,102,.6);
}

.footer-btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 24px;
  border-radius:25px;
  background:#000;
  color:#fff;
  text-decoration:none;
}

@media(max-width:768px){
  .hiring{
    font-size:42px;
  }

  .policy-grid{
    grid-template-columns:1fr;
  }

  .header{
    flex-direction:column;
    gap:15px;
  }
}
</style>
</head>
<body>

<div class="container">

<div class="header">
  <div class="leftHead">
    <div class="logo">
      <img src="logo.png" alt="logo">
    </div>

    <div>
      <div class="title">RIZZ LIVE</div>
      <div class="subtitle">
        INDIA, BANGLADESH, USA, NIGERIA, LATIN AMERICA
      </div>
    </div>
  </div>

  <div class="toggle" onclick="toggleMode()">🌙 / ☀️</div>
</div>

<div class="hero">
  <div class="glass">

    <div class="mascot">
      <img src="mascot.png" id="cat" alt="mascot">
    </div>

    <div class="tag">We’re</div>
    <div class="hiring">HIRING</div>

    <ul class="positions">
      <li>✔ BDM / ADMIN</li>
      <li>✔ Agency</li>
      <li>✔ Host</li>
      <li>✔ Coin Seller</li>
      <li>✔ Business Partner</li>
    </ul>

    <div class="policy-grid">
      <a href="#" class="policy-btn">Agency Policy</a>
      <a href="#" class="policy-btn">Host Policy</a>
      <a href="#" class="policy-btn">Seller Policy</a>
      <a href="#" class="policy-btn special">Agency Registration</a>
    </div>

  </div>
</div>

<div class="footer">

  <div class="box official-box">
    <div>🚀 RIZZ LIVE OFFICIAL</div>
    <a href="official.html" class="footer-btn">
      View Official List
    </a>
  </div>

  <br>

  <div class="box whatsapp-box">
    <div>💬 Official WhatsApp Channel</div>
    <a href="#" class="footer-btn">
      Join Now 🚀
    </a>
  </div>

</div>

</div>

<script>
function toggleMode(){
  document.body.classList.toggle("light");
}

const cat = document.getElementById("cat");

if(cat && window.innerWidth > 768){
  document.addEventListener("mousemove", function(e){
    let x = (window.innerWidth/2 - e.pageX)/40;
    let y = (window.innerHeight/2 - e.pageY)/40;
    cat.style.transform = `translate(${x}px, ${y}px)`;
  });
}
</script>

</body>
</html>
