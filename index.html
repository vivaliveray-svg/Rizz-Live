<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live Hiring</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-font-smoothing: antialiased;
}

body{
  font-family:'Poppins',sans-serif;
  background:#050014;
  color:#fff;
  transition:.4s;
}

/* LIGHT MODE */
body.light{
  background:#f5f5ff;
  color:#111;
}
body.light .title,
body.light .hiring,
body.light .positions li{
  color:#111;
  -webkit-text-fill-color:unset;
}

/* BG */
body::before{
  content:"";
  position:fixed;
  width:300%;
  height:300%;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffe1,#ff00cc);
  animation:bgMove 12s linear infinite;
  z-index:-1;
  opacity:.15;
}
@keyframes bgMove{
  100%{transform:translate(-50%,-50%)}
}

.container{max-width:1100px;margin:auto;padding:30px}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center}
.leftHead{display:flex;align-items:center;gap:15px}
.logo img{width:55px;border-radius:50%}

.title{
  font-size:26px;
  font-weight:800;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{font-size:11px;opacity:.7}

.toggle{
  cursor:pointer;
  padding:8px 14px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
}

/* GLASS */
.glass{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(25px);
  border-radius:20px;
  padding:25px;
  position:relative;
  overflow:hidden;
  animation:glassFloat 6s ease-in-out infinite;
}
@keyframes glassFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}

/* SHINE */
.glass::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:50%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
  animation:shine 4s infinite;
}
@keyframes shine{
  100%{left:120%}
}

.hero{
  display:flex;
  justify-content:center;
  margin-top:30px;
}

/* MASCOT FIX */
.mascot{
  position:absolute;
  top:-5px; /* FIXED */
  right:10px;
}
.mascot img{
  width:70px;
  animation:none;
}

/* TEXT */
.tag{
  display:inline-block;
  padding:5px 12px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
}

.hiring{
  font-size:60px;
  margin:10px 0;
  background:linear-gradient(90deg,#fff,#ff9ae6,#a18cff,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* LIST */
.positions li{list-style:none;margin:6px 0}

/* BUTTON GRID */
.policy-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

/* BUTTON */
.policy-btn{
  text-decoration:none;
  color:#fff;
  text-align:center;
  padding:8px;
  font-size:13px;
  border-radius:25px;
  background:linear-gradient(135deg,#ff4ecb,#7b5cff);
  box-shadow:0 6px 0 rgba(0,0,0,0.4),0 0 15px #ff4ecb;
  transition:.3s;
}

/* HOVER */
body:not(.light) .policy-btn:hover{
  background:#fff;
  color:#000;
}
body.light .policy-btn:hover{
  background:#000;
  color:#fff;
}

.special{
  background:linear-gradient(135deg,#00c6ff,#0072ff);
}

/* FLAGS */
.flags{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:25px;
}

.flag{
  width:65px;
  height:65px;
  border-radius:50%;
  overflow:hidden;
  position:relative;
}

/* INDIA */
.india{
  background:linear-gradient(#ff9933 33%, #fff 33% 66%, #138808 66%);
}
.india::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:14px;
  height:14px;
  border:2px solid #000080;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

/* USA */
.usa{
  background:repeating-linear-gradient(to bottom,#b22234 0 5px,#fff 5px 10px);
}
.usa::before{
  content:"";
  position:absolute;
  width:50%;
  height:50%;
  background:#3c3b6e;
}

/* BANGLADESH */
.bangladesh{
  background:#006a4e;
}
.bangladesh::after{
  content:"";
  position:absolute;
  top:50%;
  left:45%;
  width:22px;
  height:22px;
  background:#f42a41;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

/* FOOTER */
.footer{
  margin-top:30px;
  text-align:center;
}
.footer-box{
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  background:linear-gradient(90deg,#25D366,#128C7E);
  box-shadow:0 0 15px #25D366;
  line-height:1.6;
}

/* 📱 MOBILE OPTIMIZATION */
@media(max-width:768px){
  body::before{
    animation:none;
    opacity:.08;
  }

  .glass{
    backdrop-filter:none;
    background:rgba(255,255,255,0.08);
    animation:none;
  }

  .glass::before{
    display:none;
  }
}

</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="leftHead">
    <div class="logo"><img src="logo.png"></div>
    <div>
      <div class="title">RIZZ LIVE</div>

<div class="policy-grid">

<a href="https://hjpu179v3tzg.jp.larksuite.com/wiki/U9kcwpf6hikFvTk5KeDjQoAfpFe" class="policy-btn">Star Host Policy</a>

<a href="https://xjpumno595ok.jp.larksuite.com/share/base/form/shrjppqqLKpgmUaHsmQc5JWA8Ge" class="policy-btn special">Agency Registration</a>
</div>

<div class="flags">

</div>

</div>

</div>

<div class="footer">
<div class="footer-box">
💬 WhatsApp: +91 9286766608 <br>

</div>

</div>

<script>
const cat=document.getElementById('cat');

if(window.innerWidth > 768){
document.addEventListener('mousemove',(e)=>{
let x=(window.innerWidth/2-e.pageX)/40;
let y=(window.innerHeight/2-e.pageY)/40;

</script>

</body>
</html>
