<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live Hiring</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:#050014;
  color:#fff;
  overflow-x:hidden;
}

/* 🌈 ANIMATED BG */
body::before{
  content:"";
  position:fixed;
  width:300%;
  height:300%;
  background:linear-gradient(45deg,#ff00cc,#3333ff,#00ffe1,#ff00cc);
  animation:bgMove 12s linear infinite;
  z-index:-2;
  opacity:.12;
}

@keyframes bgMove{
  0%{transform:translate(0,0)}
  100%{transform:translate(-50%,-50%)}
}

/* ✨ PARTICLE GLOW */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#ffffff22 1px, transparent 1px);
  background-size:40px 40px;
  animation:moveDots 10s linear infinite;
  z-index:-1;
}

@keyframes moveDots{
  from{transform:translateY(0)}
  to{transform:translateY(-40px)}
}

.container{max-width:1100px;margin:auto;padding:30px}

/* HEADER */
.header{display:flex;align-items:center;gap:15px}
.logo img{width:55px;border-radius:50%}

.title{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{font-size:11px;opacity:.7}

/* 💎 GLASS */
.glass{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(30px);
  border-radius:25px;
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 40px rgba(255,0,200,.3), inset 0 0 20px rgba(255,255,255,0.05);
  transition:.4s;
}

.glass:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 0 80px #ff4ecb;
}

.hero{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:25px;
  margin-top:30px;
}

/* LEFT */
.left{padding:25px;position:relative}

/* 🐱 MASCOT */
.mascot{
  position:absolute;
  top:-55px;
  right:10px;
  animation:float 3s ease-in-out infinite;
}
.mascot img{width:95px}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}

/* TAG */
.tag{
  display:inline-block;
  padding:6px 15px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  box-shadow:0 0 20px #ff4ecb;
}

/* ✨ SHINY TEXT */
.hiring{
  font-size:68px;
  font-weight:800;
  margin:10px 0;
  background:linear-gradient(90deg,#fff,#ff9ae6,#a18cff,#fff);
  background-size:200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}

@keyframes shine{
  to{background-position:200% center}
}

.desc{opacity:.85;margin-bottom:15px}

.positions li{
  list-style:none;
  margin:6px 0;
  transition:.3s;
}
.positions li:hover{
  transform:translateX(8px);
  color:#ff9ae6;
}

/* 🔥 BUTTON */
.btn{
  display:inline-block;
  padding:12px 28px;
  border-radius:30px;
  font-weight:600;
  background:linear-gradient(135deg,#ff4ecb,#7b5cff);
  box-shadow:0 0 20px #ff4ecb,0 0 50px #7b5cff;
  text-decoration:none;
  color:#fff;
  position:relative;
  overflow:hidden;
}

.btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.8),transparent);
  transition:.5s;
}
.btn:hover::before{left:100%}

/* POLICY */
.policy-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.policy-btn{
  padding:8px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  text-align:center;
  color:#fff;
  text-decoration:none;
  font-size:12px;
  transition:.3s;
}

.policy-btn:hover{
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
  box-shadow:0 0 15px #ff4ecb;
}

/* FLAGS */
.right{display:flex;flex-direction:column;gap:12px}

.flag{
  height:75px;
  border-radius:15px;
  overflow:hidden;
  animation:float2 5s infinite;
  box-shadow:0 10px 25px rgba(0,0,0,.6);
}

.flag img{width:100%;height:100%;object-fit:cover}

@keyframes float2{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* MOBILE */
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .mascot{position:static;text-align:center;margin-bottom:10px}
}

</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo"><img src="logo.png"></div>
  <div>
    <div class="title">RIZZ LIVE</div>
    <div class="subtitle">GLOBAL HIRING 🌍</div>
  </div>
</div>

<div class="hero">

<div class="glass left">

  <div class="mascot">
    <img src="mascot.png">
  </div>

  <div class="tag">We’re</div>
  <div class="hiring">HIRING</div>

  <div class="desc">Join the most exciting live platform 🚀</div>

  <ul class="positions">
    <li>✔ Admin</li>
    <li>✔ Agency</li>
    <li>✔ Coin Seller</li>
    <li>✔ Partner</li>
  </ul>

  <div class="policy-grid">
    <a href="#" class="policy-btn">Agency</a>
    <a href="#" class="policy-btn">Host</a>
    <a href="#" class="policy-btn">Star Host</a>
    <a href="#" class="policy-btn">Seller</a>
  </div>

  <a href="#" class="btn">APPLY NOW</a>

</div>

<div class="right">
  <div class="glass flag"><img src="usa.png"></div>
  <div class="glass flag"><img src="india.png"></div>
  <div class="glass flag"><img src="bangladesh.png"></div>
</div>

</div>

</div>

</body>
</html>
