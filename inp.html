<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live Hiring</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background: radial-gradient(circle at 20% 20%, #3a0ca3, #0b0220 70%);
  color:#fff;
  overflow-x:hidden;
}

/* BACKGROUND GLOW */
body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:radial-gradient(circle,#ff4ecb55,transparent);
  top:-100px;
  left:-100px;
  animation: floatGlow 8s infinite alternate;
}

@keyframes floatGlow{
  0%{transform:translate(0,0)}
  100%{transform:translate(150px,150px)}
}

.container{max-width:1100px;margin:auto;padding:30px}

/* HEADER */
.header{display:flex;align-items:center;gap:15px}
.logo img{width:55px;border-radius:50%}
.title{font-size:26px;font-weight:800}
.subtitle{font-size:11px;opacity:.7}

/* GLASS */
.glass{
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(25px);
  border-radius:25px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 0 50px rgba(255,0,200,.15);
  transition:.4s;
}

.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:25px;margin-top:30px}

/* LEFT */
.left{
  padding:25px;
  position:relative;
}

/* MASCOT */
.mascot{
  position:absolute;
  top:-40px;
  right:20px;
  animation: float 3s infinite ease-in-out;
}
.mascot img{width:85px}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* TAG */
.tag{
  display:inline-block;
  padding:6px 14px;
  border-radius:20px;
  background:linear-gradient(90deg,#ff4ecb,#7b5cff);
}

/* TEXT */
.hiring{
  font-size:60px;
  font-weight:800;
  margin:10px 0;
  background:linear-gradient(90deg,#ff9ae6,#a18cff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.desc{opacity:.85;margin-bottom:15px}

.positions li{list-style:none;margin:6px 0}

/* BUTTON */
.btn{
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  font-weight:600;
  background:linear-gradient(135deg,#ff4ecb,#7b5cff);
  box-shadow:0 0 20px rgba(255,0,200,0.5);
  text-decoration:none;
  color:#fff;
  margin-top:10px;
}

/* POLICY */
.policy-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:15px;
}

.policy-btn{
  padding:8px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-size:12px;
}

/* RIGHT FLAGS */
.right{display:flex;flex-direction:column;gap:12px}

.flag{
  height:80px;
  border-radius:15px;
  overflow:hidden;
  animation: float2 5s infinite;
}

.flag img{width:100%;height:100%;object-fit:cover}

@keyframes float2{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* FOOTER */
.footer{
  margin-top:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* MOBILE */
@media(max-width:900px){
  .hero{grid-template-columns:1fr}

  .mascot{
    position:static;
    text-align:center;
    margin-bottom:10px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="logo">
    <img src="logo.png">
  </div>
  <div>
    <div class="title">RIZZ LIVE</div>
    <div class="subtitle">INDIA, BANGLADESH, NEPAL, USA</div>
  </div>
</div>

<div class="hero">

<div class="glass left">

  <div class="mascot">
    <img src="mascot.png">
  </div>

  <div class="tag">We’re</div>
  <div class="hiring">HIRING!</div>

  <div class="desc">
    Join our team and grow with Rizz Live 🚀
  </div>

  <ul class="positions">
    <li>✔ Admin</li>
    <li>✔ Agency</li>
    <li>✔ Coin Seller</li>
    <li>✔ Partner</li>
  </ul>

  <div class="policy-grid">
    <a href="#" class="policy-btn">Agency Policy</a>
    <a href="#" class="policy-btn">Host Policy</a>
    <a href="#" class="policy-btn">Star Host</a>
    <a href="#" class="policy-btn">Coin Seller</a>
  </div>

  <a href="#" class="btn">APPLY NOW</a>

</div>

<div class="right">
  <div class="glass flag"><img src="usa.png"></div>
  <div class="glass flag"><img src="india.png"></div>
  <div class="glass flag"><img src="bangladesh.png"></div>
</div>

</div>

<div class="footer">
  <div>Contact: +91 9286766608</div>
</div>

</div>

</body>
</html>
